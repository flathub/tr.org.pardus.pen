app-id: tr.org.pardus.pen
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: pardus-pen
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=ipc

modules:
  - name: pardus-pen
    buildsystem: meson
    build-options:
      append-path: /usr/libexec:/usr/lib/libexec
    config-opts:
      - -Dqt=6
      - -Dpdf=false
      - -Dscreenshot=false
      - -Dbackgrounds=/app/backgrounds
      - -Dicon-name=tr.org.pardus.pen
    sources:
      - type: git
        url: https://github.com/pardus/pardus-pen.git
        tag: debian/4.3.0
        commit: 01e27a87c553f22dc05b8a27c4f49ae61b10d799
        x-checker-data:
          type: git
          tag-pattern: ^debian\/([\d.]+)$
